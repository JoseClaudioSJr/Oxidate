[package]
name = "oxidate-fsm"
version = "0.1.0"
edition = "2021"
description = "FSM framework with GUI visualization - Mermaid-like DSL to Rust code generator"
authors = ["Jose Claudio da Silva Junior"]
license = "MIT"
repository = "https://github.com/JoseClaudioSJr/Oxidate"
homepage = "https://github.com/JoseClaudioSJr/Oxidate"
documentation = "https://docs.rs/oxidate-fsm"
readme = "README.md"
rust-version = "1.70"
keywords = ["fsm", "state-machine", "code-generator", "embedded", "gui"]
categories = ["development-tools", "development-tools::build-utils", "embedded"]

# Keep the published crate small and focused.
# (GUI demo assets and packaging/tooling remain available on GitHub.)
#
# `docs/` is deliberately not shipped: it is reference material that tracks
# intent rather than the implementation, so publishing it to crates.io would
# distribute documentation for behaviour the generator does not yet have. It
# stays on GitHub, where it is versioned alongside the issues that describe the
# gaps.
include = [
    "/Cargo.toml",
    "/README.md",
    "/LICENSE",
    "/src/**",
    "/examples/**",
]

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui", "dep:egui_extras", "dep:rfd", "dep:dagre"]  # GUI editor (default)

# Premium features (available separately)
# embassy = []  # Embassy async code generation - see docs/PREMIUM_FEATURES.md
# rtic = []     # RTIC real-time code generation - see docs/PREMIUM_FEATURES.md

[dependencies]
# GUI
eframe = { version = "0.29", optional = true }
# Graph layout for the GUI. A pure-Rust port of dagre.js, replacing the previous
# setup that shelled out to Node. Optional and tied to `gui` on purpose: it needs
# edition 2024 (rustc 1.85+), and gating it here keeps the library usable as a
# code generator on the MSRV declared above.
dagre = { version = "0.1", optional = true }
egui = { version = "0.29", optional = true }
egui_extras = { version = "0.29", features = ["all_loaders"], optional = true }

# Parser
# Upper-bounded on purpose: pest 2.8 raises its own MSRV to rustc 1.83, which
# would silently break the `rust-version = "1.70"` declared above for anyone on
# a cargo older than the MSRV-aware resolver (< 1.84). pest is an internal
# implementation detail here, so capping it costs downstream users nothing.
pest = ">=2.7, <2.8"
pest_derive = ">=2.7, <2.8"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Layout engine: see the `dagre` dependency above (pure Rust, no subprocess).

# Code generation
quote = "1.0"
proc-macro2 = "1.0"

# Utilities
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"

# File dialog
rfd = { version = "0.14", optional = true }

[package.metadata.bundle]
name = "Oxidate"
identifier = "com.joseclaudio.oxidate"
icon = ["assets/oxidate.icns"]
# Nothing extra to bundle: layout is compiled into the binary.

[package.metadata.deb]
section = "utils"
priority = "optional"
assets = [
	["target/release/oxidate", "usr/bin/oxidate", "755"],
	["target/release/oxidate-cli", "usr/bin/oxidate-cli", "755"],
	["assets/linux/oxidate.desktop", "usr/share/applications/oxidate.desktop", "644"],
	["assets/oxidate.png", "usr/share/icons/hicolor/512x512/apps/oxidate.png", "644"],
]

[package.metadata.docs.rs]
no-default-features = true

[[bin]]
name = "oxidate"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "oxidate-cli"
path = "src/cli.rs"
